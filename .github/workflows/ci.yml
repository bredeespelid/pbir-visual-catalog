name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --ignore-scripts: nothing here needs install scripts (e.g. browser downloads).
      - name: Install pinned Microsoft packages
        run: npm ci --ignore-scripts

      - name: Dependencies are pinned to exact versions
        run: python3 scripts/check_pins.py

      - name: Catalog is up to date
        run: python3 scripts/check_catalog.py

      # Fails on schema errors AND on skipped (unreachable) schemas, so this
      # check can never pass without actually validating.
      - name: Examples validate against PBIR schemas and the catalog
        run: python3 scripts/validate_report.py
