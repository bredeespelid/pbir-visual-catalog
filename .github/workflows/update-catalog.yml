name: Update catalog

# Regenerates catalog/ when Dependabot bumps the Microsoft packages, or on demand.
# If the export breaks, Microsoft most likely changed an output format: the job
# fails with an annotation naming the cause.

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-catalog-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  update:
    # Only Dependabot PRs (never arbitrary PRs) or a manual run.
    if: github.event_name == 'workflow_dispatch' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so CI will not
      # re-run on the bot commit. Set CATALOG_BOT_TOKEN (a fine-grained PAT or GitHub
      # App token with contents+pull-requests write) as a *Dependabot* secret AND an
      # Actions secret to get automatic CI re-runs. See README.
      TOKEN: ${{ secrets.CATALOG_BOT_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ env.TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned Microsoft packages
        run: npm ci --ignore-scripts

      - name: Regenerate catalog
        id: export
        run: python3 scripts/export_visual_catalog.py

      - name: Explain export failure
        if: failure() && steps.export.outcome == 'failure'
        run: |
          {
            echo "### Catalog export failed"
            echo
            echo "The export script could not process the installed Microsoft packages."
            echo "This is the signature of an **API/format change on Microsoft's side**."
            echo
            echo "1. Read the error annotation above for the exact cause."
            echo "2. Compare \`@microsoft/powerbi-report-authoring-cli\` and \`@microsoft/powerbi-core-visual-schema\` release notes between the old and new version in package.json."
            echo "3. Adapt \`scripts/export_visual_catalog.py\` (or hold back the bump) and push to this branch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push changes
        env:
          # Passed via env (not interpolated into the script) to avoid script injection via branch names.
          EVENT: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if git diff --quiet -- catalog && [ -z "$(git ls-files --others --exclude-standard catalog)" ]; then
            echo "Catalog already up to date."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog
          git commit -m "chore(catalog): regenerate from updated Microsoft packages"
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$BRANCH_NAME" = "$DEFAULT_BRANCH" ]; then
            # Never push straight to the default branch: open a PR instead.
            NEW_BRANCH="catalog/refresh-${RUN_ID}"
            git push origin "HEAD:refs/heads/${NEW_BRANCH}"
            GH_TOKEN="$TOKEN" gh pr create --base "$DEFAULT_BRANCH" --head "$NEW_BRANCH" \
              --title "chore(catalog): regenerate catalog" \
              --body "Regenerated by the Update catalog workflow."
          else
            git push origin "HEAD:${BRANCH_NAME}"
          fi
